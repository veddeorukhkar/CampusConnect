<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notices — CampusConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fa-solid fa-graduation-cap"></i> CampusConnect</div>
    <div class="user-chip">
      <div class="avatar js-user-initials">?</div>
      <div><div class="name js-user-name">Loading...</div><div class="role js-user-role">student</div></div>
    </div>
    <nav class="side-nav">
      <a href="student-dashboard.html"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
      <a href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
      <a href="requests.html"><i class="fa-solid fa-file-circle-check"></i> Service Requests</a>
      <a href="notices.html" class="active"><i class="fa-solid fa-bullhorn"></i> Notices</a>
      <a href="events.html"><i class="fa-solid fa-calendar-days"></i> Events</a>
      <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
    </nav>
    <div class="sidebar-footer"><a href="#" class="js-logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="flex gap-12" style="align-items:center;">
        <button class="hamburger icon-btn" id="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
        <h1>Campus Notices</h1>
      </div>
      <div class="topbar-actions"><button class="icon-btn" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button></div>
    </div>

    <div class="page-body">
      <div class="toolbar">
        <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="search-input" placeholder="Search notices..."></div>
        <select class="filter-select" id="category-filter">
          <option value="">All Categories</option>
          <option>Academic</option><option>Exam</option><option>Event</option><option>Administration</option><option>IT</option><option>General</option>
        </select>
      </div>
      <div id="notices-grid" style="display:grid; grid-template-columns:repeat(2,1fr); gap:18px;"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/notices.js"></script>
<script>requireAuth();</script>
<style>@media(max-width:760px){#notices-grid{grid-template-columns:1fr !important;}}</style>
</body>
</html>
