<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — CampusConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fa-solid fa-graduation-cap"></i> CampusConnect</div>
    <div class="user-chip">
      <div class="avatar js-user-initials">?</div>
      <div><div class="name js-user-name">Loading...</div><div class="role js-user-role">student</div></div>
    </div>
    <nav class="side-nav">
      <a href="student-dashboard.html"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
      <a href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
      <a href="requests.html"><i class="fa-solid fa-file-circle-check"></i> Service Requests</a>
      <a href="notices.html"><i class="fa-solid fa-bullhorn"></i> Notices</a>
      <a href="events.html"><i class="fa-solid fa-calendar-days"></i> Events</a>
      <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profile</a>
    </nav>
    <div class="sidebar-footer"><a href="#" class="js-logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="flex gap-12" style="align-items:center;">
        <button class="hamburger icon-btn" id="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
        <h1>My Profile</h1>
      </div>
      <div class="topbar-actions"><button class="icon-btn" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button></div>
    </div>

    <div class="page-body" style="max-width:700px;">
      <div class="card" style="padding:28px;">
        <div class="flex gap-16" style="align-items:center; margin-bottom:26px;">
          <div class="avatar js-user-initials" style="width:64px;height:64px;font-size:22px;">?</div>
          <div>
            <h2 class="js-user-name" style="font-size:20px;">Loading...</h2>
            <p class="text-secondary" id="profile-studentid">Student ID: —</p>
          </div>
        </div>

        <form id="profile-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="profile-name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="profile-email" disabled>
            <div class="form-hint">Email cannot be changed. Contact admin for assistance.</div>
          </div>
          <div class="form-group" style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
            <div>
              <label class="form-label">Department</label>
              <select class="form-control" id="profile-department" required>
                <option>Computer Science</option><option>Electronics</option><option>Mechanical</option><option>Civil</option><option>Business Administration</option>
              </select>
            </div>
            <div>
              <label class="form-label">Year</label>
              <select class="form-control" id="profile-year" required>
                <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Account Created</label>
            <input type="text" class="form-control" id="profile-created" disabled>
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script>requireAuth();</script>
</body>
</html>
