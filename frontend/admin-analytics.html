<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — CampusConnect Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-admin-page="true">

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fa-solid fa-graduation-cap"></i> CampusConnect</div>
    <div class="user-chip">
      <div class="avatar js-user-initials">?</div>
      <div><div class="name js-user-name">Loading...</div><div class="role js-user-role">admin</div></div>
    </div>
    <nav class="side-nav">
      <div class="nav-section-title">Overview</div>
      <a href="admin-dashboard.html"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
      <a href="admin-analytics.html" class="active"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
      <div class="nav-section-title">Manage</div>
      <a href="admin-complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
      <a href="admin-requests.html"><i class="fa-solid fa-file-circle-check"></i> Service Requests</a>
      <a href="admin-students.html"><i class="fa-solid fa-users"></i> Students</a>
      <a href="admin-notices.html"><i class="fa-solid fa-bullhorn"></i> Notices</a>
      <a href="admin-events.html"><i class="fa-solid fa-calendar-days"></i> Events</a>
    </nav>
    <div class="sidebar-footer"><a href="#" class="js-logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="flex gap-12" style="align-items:center;">
        <button class="hamburger icon-btn" id="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
        <h1>Analytics</h1>
      </div>
      <div class="topbar-actions"><button class="icon-btn" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button></div>
    </div>

    <div class="page-body">
      <div class="charts-row">
        <div class="card chart-card">
          <div class="section-header"><h2>Complaints by Category</h2></div>
          <canvas id="analytics-category-chart"></canvas>
        </div>
        <div class="card chart-card">
          <div class="section-header"><h2>Complaint Status Breakdown</h2></div>
          <canvas id="analytics-status-chart"></canvas>
        </div>
      </div>

      <div class="charts-row">
        <div class="card chart-card">
          <div class="section-header"><h2>Service Requests by Category</h2></div>
          <canvas id="analytics-request-chart"></canvas>
        </div>
        <div class="card chart-card">
          <div class="section-header"><h2>Students by Department</h2></div>
          <canvas id="analytics-dept-chart"></canvas>
        </div>
      </div>

      <div class="card chart-card">
        <div class="section-header"><h2>Monthly Complaint Trend</h2></div>
        <canvas id="analytics-trend-chart"></canvas>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>requireAdmin();</script>
</body>
</html>
