<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Service Requests — CampusConnect Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-admin-page="true">

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fa-solid fa-graduation-cap"></i> CampusConnect</div>
    <div class="user-chip">
      <div class="avatar js-user-initials">?</div>
      <div><div class="name js-user-name">Loading...</div><div class="role js-user-role">admin</div></div>
    </div>
    <nav class="side-nav">
      <div class="nav-section-title">Overview</div>
      <a href="admin-dashboard.html"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
      <a href="admin-analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
      <div class="nav-section-title">Manage</div>
      <a href="admin-complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
      <a href="admin-requests.html" class="active"><i class="fa-solid fa-file-circle-check"></i> Service Requests</a>
      <a href="admin-students.html"><i class="fa-solid fa-users"></i> Students</a>
      <a href="admin-notices.html"><i class="fa-solid fa-bullhorn"></i> Notices</a>
      <a href="admin-events.html"><i class="fa-solid fa-calendar-days"></i> Events</a>
    </nav>
    <div class="sidebar-footer"><a href="#" class="js-logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="flex gap-12" style="align-items:center;">
        <button class="hamburger icon-btn" id="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
        <h1>Manage Service Requests</h1>
      </div>
      <div class="topbar-actions"><button class="icon-btn" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button></div>
    </div>

    <div class="page-body">
      <div class="card" style="padding:20px;">
        <div class="toolbar">
          <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="search-input" placeholder="Search by category or student..."></div>
          <select class="filter-select" id="status-filter"><option value="">All Statuses</option><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Student</th><th>Category</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="admin-requests-tbody"><tr><td colspan="5"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="manage-modal">
  <div class="modal-box" style="max-width:480px;">
    <div class="modal-header"><h3 id="manage-title">Item</h3><span class="modal-close" id="close-manage-modal"><i class="fa-solid fa-xmark"></i></span></div>
    <p class="text-muted" style="font-size:13px;" id="manage-student"></p>
    <p class="text-secondary mb-16" id="manage-description"></p>
    <div class="form-group">
      <label class="form-label">Update Status</label>
      <select class="form-control" id="manage-status"><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select>
    </div>
    <div class="form-group">
      <label class="form-label">Admin Response</label>
      <textarea class="form-control" id="manage-response" placeholder="Add a note for the student..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancel-manage">Cancel</button>
      <button class="btn btn-primary" id="save-manage">Save Update</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>requireAdmin();</script>
</body>
</html>
